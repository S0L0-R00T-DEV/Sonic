name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/SonicUI/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check release tag matches app version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = node -p "require('./ui/SonicUI/package.json').version"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "Tag $env:GITHUB_REF_NAME does not match package version $version" }
      - name: Configure Windows signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Release blocked: configure WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD secrets.'
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'sonic-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signingCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:WINDOWS_CERTIFICATE_PASSWORD)
          "SONIC_SIGNING_CERT_THUMBPRINT=$($signingCertificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Configured expected release signer thumbprint $($signingCertificate.Thumbprint)"
          "CSC_LINK=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Pin update publisher key in the application
        shell: pwsh
        env:
          SONIC_UPDATE_SIGNING_KEY_PEM: ${{ secrets.SONIC_UPDATE_SIGNING_KEY_PEM }}
        run: |
          if (-not $env:SONIC_UPDATE_SIGNING_KEY_PEM) {
            throw 'Release blocked: configure SONIC_UPDATE_SIGNING_KEY_PEM as a protected GitHub Actions secret.'
          }
          node ./ui/SonicUI/scripts/generate-update-trust.mjs
      - name: Build signed application, CLI, and browser extension
        shell: pwsh
        run: .\build.ps1 -Release
      - name: Create signed update manifest
        shell: pwsh
        env:
          SONIC_UPDATE_SIGNING_KEY_PEM: ${{ secrets.SONIC_UPDATE_SIGNING_KEY_PEM }}
          SONIC_UPDATE_SIGNING_KEY_ID: ${{ vars.SONIC_UPDATE_SIGNING_KEY_ID }}
        run: |
          if (-not $env:SONIC_UPDATE_SIGNING_KEY_PEM) {
            throw 'Release blocked: configure SONIC_UPDATE_SIGNING_KEY_PEM as a protected GitHub Actions secret.'
          }
          $version = node -p "require('./ui/SonicUI/package.json').version"
          node ./ui/SonicUI/scripts/create-signed-update-manifest.mjs $version ./ui/SonicUI/dist-sonic-release/Sonic-Setup-x64.exe win32 ./ui/SonicUI/dist-sonic-release/sonic-update-manifest.json
      - name: Verify only the installer is published
        shell: pwsh
        run: |
          $installer = Resolve-Path './ui/SonicUI/dist-sonic-release/Sonic-Setup-x64.exe' -ErrorAction Stop
          if ([IO.Path]::GetExtension($installer.Path) -ne '.exe') { throw 'Expected a Windows .exe installer.' }
          Write-Host "Verified release installer: $installer"
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-windows-installer
          path: ui/SonicUI/dist-sonic-release/Sonic-Setup-x64.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $notes = @'
          ## Sonic 1.1.0

          ### What's new
          - Added Microsoft Edge and Vivaldi to the browser-extension support list.
          - Added a Terms of Service dialog.
          - Added distinct icons for different application modes.
          - Expanded CLI automation with machine-readable command discovery, health checks, download statistics, and batch download submission.
          - Added download and history filtering and pagination, plus compact JSON output for scripts and AI clients.
          - Added automatic Sonic launch for CLI commands when the app is closed and its executable can be located; use --no-launch to disable it.

          ### CLI and reliability
          - Standardized and documented the supported command catalog and aliases.
          - Improved CLI JSON-file handling for batch downloads and settings updates.
          - Updated CLI usage documentation with the current command inventory and verification status.

          ### Verification notes
          - The recorded manual acceptance checklist has 77/77 rows marked PASS.
          - Build, lint, and .NET CLI Release build passed locally.
          - Some real-peer transfer and destination/file-removal edge cases remain documented in CLI_USAGE.md; this release note does not claim those edge cases were exhaustively certified.
          '@
          gh release create $env:TAG ui/SonicUI/dist-sonic-release/Sonic-Setup-x64.exe --title "Sonic 1.1.0" --notes $notes

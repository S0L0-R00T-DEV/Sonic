name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild and replace its installer and signed manifest (for example v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/SonicUI/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check release tag matches app version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = node -p "require('./ui/SonicUI/package.json').version"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "Tag $env:GITHUB_REF_NAME does not match package version $version" }
      - name: Configure Windows signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Release blocked: configure WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD secrets.'
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'sonic-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signingCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:WINDOWS_CERTIFICATE_PASSWORD)
          "SONIC_SIGNING_CERT_THUMBPRINT=$($signingCertificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Configured expected release signer thumbprint $($signingCertificate.Thumbprint)"
          "CSC_LINK=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Pin update publisher key in the application
        shell: pwsh
        env:
          SONIC_UPDATE_SIGNING_KEY_PEM: ${{ secrets.SONIC_UPDATE_SIGNING_KEY_PEM }}
        run: |
          if (-not $env:SONIC_UPDATE_SIGNING_KEY_PEM) {
            throw 'Release blocked: configure SONIC_UPDATE_SIGNING_KEY_PEM as a protected GitHub Actions secret.'
          }
          node ./ui/SonicUI/scripts/generate-update-trust.mjs
      - name: Build signed application, CLI, and browser extension
        shell: pwsh
        run: .\build.ps1 -Release
      - name: Download v1.1.1 baseline for updater regression
        shell: pwsh
        run: |
          $previousInstaller = Join-Path $env:RUNNER_TEMP 'Sonic-Setup-v1.1.1-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/S0L0-R00T-DEV/Sonic/releases/download/v1.1.1/Sonic-Setup-x64.exe' -OutFile $previousInstaller
          if (-not (Test-Path -LiteralPath $previousInstaller -PathType Leaf) -or (Get-Item $previousInstaller).Length -lt 100000000) { throw 'Could not download the v1.1.1 baseline installer.' }
          "SONIC_PREVIOUS_INSTALLER=$previousInstaller" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Smoke-test installed release and updater regression
        shell: pwsh
        run: .\ui\SonicUI\scripts\installer-smoke-test.ps1 -InstallerPath .\ui\SonicUI\dist-sonic-release\Sonic-Setup-x64.exe -ExpectedVersion (node -p "require('./ui/SonicUI/package.json').version") -PreviousInstallerPath $env:SONIC_PREVIOUS_INSTALLER
      - name: Create signed update manifest
        shell: pwsh
        env:
          SONIC_UPDATE_SIGNING_KEY_PEM: ${{ secrets.SONIC_UPDATE_SIGNING_KEY_PEM }}
          SONIC_UPDATE_SIGNING_KEY_ID: ${{ vars.SONIC_UPDATE_SIGNING_KEY_ID }}
        run: |
          if (-not $env:SONIC_UPDATE_SIGNING_KEY_PEM) {
            throw 'Release blocked: configure SONIC_UPDATE_SIGNING_KEY_PEM as a protected GitHub Actions secret.'
          }
          $version = node -p "require('./ui/SonicUI/package.json').version"
          node ./ui/SonicUI/scripts/create-signed-update-manifest.mjs $version ./ui/SonicUI/dist-sonic-release/Sonic-Setup-x64.exe win32 ./ui/SonicUI/dist-sonic-release/sonic-update-manifest.json
      - name: Verify the two permitted release assets
        shell: pwsh
        run: |
          $output = './ui/SonicUI/dist-sonic-release'
          $installer = Join-Path $output 'Sonic-Setup-x64.exe'
          $manifest = Join-Path $output 'sonic-update-manifest.json'
          foreach ($path in @($installer, $manifest)) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required release asset is missing: $path" } }
          $manifestData = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if (-not $manifestData.payload -or -not $manifestData.signature) { throw 'Update manifest must contain signed payload and signature.' }
          $payload = $manifestData.payload | ConvertFrom-Json
          if ($payload.assetName -ne 'Sonic-Setup-x64.exe' -or $payload.platform -ne 'win32') { throw 'Update manifest does not describe the Windows Sonic installer.' }
          Write-Host 'Verified permitted release assets: Sonic-Setup-x64.exe and sonic-update-manifest.json'
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-windows-installer
          path: |
            ui/SonicUI/dist-sonic-release/Sonic-Setup-x64.exe
            ui/SonicUI/dist-sonic-release/sonic-update-manifest.json
          if-no-files-found: error
      - name: Publish or refresh GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: pwsh
        run: |
          $notes = @'
          ## Sonic 1.1.4

          ### In-app updater reliability
          - Launch the update supervisor from a separately packaged PowerShell script rather than a long inline command.
          - Keep Sonic open until the supervisor confirms it started; show diagnostic details if handoff fails.
          - Recheck installer SHA-256 immediately before launch, verify the installed version, and verify the relaunch.
          - Add release CI coverage for the supervisor-driven install/update/restart path in an isolated directory.

          ### Verification
          - Release CI validates the installer, packaged supervisor script, update-integrity checks, installed version, and visible app relaunch.
          '@
          if ($env:TAG -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$') { throw "Invalid release tag: $env:TAG" }
          $installer = 'ui/SonicUI/dist-sonic-release/Sonic-Setup-x64.exe'
          $manifest = 'ui/SonicUI/dist-sonic-release/sonic-update-manifest.json'
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            gh release view $env:TAG *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $env:TAG $installer $manifest --clobber
            } else {
              gh release create $env:TAG $installer $manifest --title "Sonic $($env:TAG.TrimStart('v'))" --notes $notes
            }
          } else {
            gh release create $env:TAG $installer $manifest --title "Sonic $($env:TAG.TrimStart('v'))" --notes $notes
          }

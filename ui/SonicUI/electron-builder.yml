appId: com.speedofreq.sonic
productName: Sonic
copyright: Copyright 2026 Sonic
electronDist: node_modules/electron/dist
directories:
  buildResources: build
  output: dist-sonic-release
files:
  - '!tests/**'
  - '!LICENSE'
  - '!THIRD_PARTY_NOTICES.md'
  - '!patches/**'
  - '!third-party-license-cache/**'
  - '!scripts/**'
  - '!dist/**'
  - '!dist-sonic/**'
  - '!dist-sonic-release/**'
  - '!dist-sonic-*/**'
  - '!playwright*.log'
  - '!playwright*-exit-code.txt'
  - '!playwright.config.ts'
  - '!tsconfig.e2e.json'
  - '!release-static-checks.log'
  - '!release-static-exit-code.txt'
  - '!security-gate-run.log'
  - '!security-gate-exit-code.txt'
  - '!CONTRIBUTING.md'
  - '!SECURITY.md'
  - '!components.json'
  - '!docs/**'
  - '!e2e/**'
  - '!test-results/**'
  - '!artifacts/**'
  - '!diagnostics/**'
  - '!references/**'
  - '!Phase0/**'
  - '!extension/**'
  - '!.github/**'
  - '!.vscode/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!node_modules/koffi/{src,vendor,doc}/**'
  - '!node_modules/koffi/build/koffi/!(linux_x64|linux_arm64|win32_x64|win32_arm64)/**'
  - '!node_modules/node-datachannel/**'
  - '!node_modules/webrtc-polyfill/**'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: ../../artifacts/sonic-backend-current/win-x64
    to: sonic-backend
  - from: extension/dist
    to: browser-extensions
  - from: ../../artifacts/sonic-cli-win-x64
    to: sonic-cli
  - from: LICENSE
    to: legal/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
asarUnpack:
  - resources/**
win:
  # Unsigned local builds are allowed when no signing certificate is configured.
  # Release signing can be supplied by the CI certificate environment.
  executableName: Sonic
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Sonic-Setup-x64.exe
  oneClick: false
  perMachine: true
  allowElevation: true
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  shortcutName: Sonic
  uninstallDisplayName: Sonic
  createDesktopShortcut: always
npmRebuild: false
